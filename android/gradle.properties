org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Workaround for Kotlin incremental compiler cache issues
kotlin.incremental=false

# Slow/unstable networks: Gradle downloading Flutter engine artifacts from storage.googleapis.com
# can hit default timeouts — extend HTTP timeouts (milliseconds).
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
